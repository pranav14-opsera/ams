# NOT YET EXECUTING FOR REAL: SonarQube quality-gate analysis needs either
# a SonarCloud org+token or a reachable self-hosted SonarQube server —
# neither exists in this environment. This file is the real config that
# takes effect the moment SONAR_TOKEN (and, for self-hosted, SONAR_HOST_URL)
# are added as repo secrets; the security-scans.yml workflow's sonarqube
# job is conditioned on SONAR_TOKEN being present.

sonar.projectKey=pranav14-opsera_ams
sonar.organization=pranav14-opsera

sonar.sources=frontend/app,frontend/next.config.js,backend/src
sonar.tests=backend/test,database/tests
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/*.tsbuildinfo

sonar.typescript.tsconfigPath=frontend/tsconfig.json,backend/tsconfig.json
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Quality gate (acceptance criteria): zero critical/high security hotspots,
# 80% coverage threshold, complexity limit of 15/method. The actual gate
# thresholds are configured server-side (SonarCloud/SonarQube project
# settings, not this file) once a server exists — documented here so the
# expected values are traceable to WO-008's acceptance criteria.
sonar.qualitygate.wait=true
