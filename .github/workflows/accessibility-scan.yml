name: Accessibility scan

# Realizes the pipeline's scan:axe-core step (.forge/pipeline.yaml, WO-009):
# builds the frontend's static export, serves it, and runs axe-core across
# every discovered route at 3 viewports. Critical WCAG 2.1 AA violations
# fail the job; serious violations are reported but don't block (matching
# the acceptance criteria's configurable threshold).

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  pull_request:
    paths:
      - "frontend/**"

permissions:
  contents: read

jobs:
  axe-core:
    name: scan / axe-core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright's Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build static export
        working-directory: frontend
        run: npm run build

      - name: Serve static export
        working-directory: frontend
        run: npm run a11y:serve &

      - name: Wait for server
        run: npx --yes wait-on http://localhost:4173

      - name: Run axe-core scan
        working-directory: frontend
        run: npm run a11y:scan

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-axe-core
          path: frontend/axe-report.json
          retention-days: 90
