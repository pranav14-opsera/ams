name: Backend checks

# Runs backend/'s real test suite (WO-013: tenant provisioning saga,
# JWT verification, tenant-context middleware, RLS cross-tenant
# isolation) against an actual PostgreSQL service container — no
# Docker/testcontainers available in this environment's local dev setup
# (documented throughout this repo), but GitHub Actions' own service
# containers work fine and are what CI actually uses.

on:
  pull_request:
    paths:
      - "backend/**"
      - "database/migrations/**"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "database/migrations/**"

permissions:
  contents: read

jobs:
  test:
    name: backend / typecheck + test (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install database migration runner
        working-directory: database
        run: npm install

      - name: Run migrations
        working-directory: database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run migrate

      # ams_app authenticates via IAM/Secrets Manager in deployed
      # environments — this static password only exists so CI's backend
      # test suite (which connects as ams_app, the least-privilege role
      # RLS actually applies to) can authenticate against the container's
      # default password auth.
      - name: Set test password for ams_app role
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c "ALTER ROLE ams_app PASSWORD 'postgres';"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Build
        working-directory: backend
        run: npm run build

      # Real bug found in WO-015: none of this suite's tests exercise
      # actual NestJS dependency injection (they all construct classes
      # directly, bypassing the DI container) — a *.module.ts wiring
      # mistake had no automated check that could catch it. Runs against
      # the just-built dist/, the same artifact a real deployment runs.
      - name: Verify DI graph boots (compiled build)
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run verify-boot

      - name: Test
        working-directory: backend
        env:
          # DATABASE_URL stays the postgres superuser here — several
          # existing tests (e.g. tenant-rls-integration.test.ts) construct
          # their OWN ams_app connection FROM this value by swapping the
          # username, and use the superuser connection deliberately as an
          # RLS-bypassing ground truth for seeding/assertions. Switching
          # this whole env var breaks that pattern. WO-015 instead adds a
          # dedicated test (tenant-provisioning.saga.ams-app.test.ts) that
          # explicitly connects as ams_app to exercise the saga the way
          # production actually does — see that file for why this matters.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm test
