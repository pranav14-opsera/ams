# Custom, platform-specific rules. The standard OWASP/TypeScript/Node.js
# rulesets (p/owasp-top-ten, p/typescript, p/nodejs) are pulled from the
# Semgrep registry at scan time (see .github/workflows/security-scans.yml)
# rather than vendored here — this file holds only rules specific to this
# codebase that the public registry has no way to know about.

rules:
  - id: raw-sql-missing-tenant-filter
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Raw SQL query with no visible tenant_id reference. Queries against
      tenant-scoped tables should filter by tenant_id explicitly even
      though the ams_app role's Postgres RLS policy
      (database/migrations/006_enable_rls.sql) enforces isolation as a
      defense-in-depth backstop — an explicit filter also lets the query
      planner use the tenant_id index instead of relying on RLS to
      filter every row post-scan.
    patterns:
      - pattern: $CLIENT.query($QUERY, ...)
      - metavariable-regex:
          metavariable: $CLIENT
          regex: ^(pool|client|db)$
      - metavariable-pattern:
          metavariable: $QUERY
          patterns:
            - pattern-not-regex: tenant_id
      # BEGIN/COMMIT/ROLLBACK are transaction control, never a query
      # against tenant-scoped data — flagging them was always a false
      # positive, found by running this rule against WO-013's saga code
      # (infrastructure/terraform/kms's rotation Lambda pattern doesn't
      # hit this because Python isn't in `languages` above; this is the
      # first TypeScript code using explicit BEGIN/COMMIT/ROLLBACK).
      - metavariable-pattern:
          metavariable: $QUERY
          patterns:
            - pattern-not-regex: ^"(BEGIN|COMMIT|ROLLBACK)"$
      # WO-048: set_config('app.current_tenant', ...) IS the tenant-scoping
      # mechanism itself (RLS session plumbing), not a query against a
      # tenant-scoped table — it always takes tenantId as its own $1
      # parameter, so flagging it as "missing a tenant filter" is a false
      # positive, the same class as the BEGIN/COMMIT/ROLLBACK exclusion
      # above. Every set_config-excluded call site here already appears
      # inside a runtime-verified BEGIN/set_config/COMMIT block (see
      # AUDIT_RECONCILIATION.md).
      - metavariable-pattern:
          metavariable: $QUERY
          patterns:
            - pattern-not-regex: set_config
      # WO-048: verify_audit_event_hash(p_event_id) (migration 042) looks
      # up one row by primary key from WITHIN a transaction that has
      # already called set_config('app.current_tenant', ...) — RLS scopes
      # the lookup, and there is no tenant_id column on this function-call
      # form of query to filter by explicitly.
      - metavariable-pattern:
          metavariable: $QUERY
          patterns:
            - pattern-not-regex: verify_audit_event_hash
      # WO-049: `SET lock_timeout = ...` is per-session configuration, not
      # a query against any table at all — same class of false positive
      # as the BEGIN/COMMIT/ROLLBACK exclusion above.
      - metavariable-pattern:
          metavariable: $QUERY
          patterns:
            - pattern-not-regex: ^`SET
      # WO-049: detach_and_drop_audit_events_partition (migration 043) is
      # a platform-level operation on a single, already time-partitioned
      # audit_events partition covering EVERY tenant's rows for that
      # period — there is no one tenant_id to filter by, the same
      # structural reason `tenants` itself (and list_audit_events_partitions_older_than,
      # which only reads pg_catalog) are excluded above.
      - metavariable-pattern:
          metavariable: $QUERY
          patterns:
            - pattern-not-regex: detach_and_drop_audit_events_partition
    paths:
      exclude:
        # Migration runner: DDL + schema_migrations bookkeeping, not
        # queries against tenant-scoped application tables.
        - database/migrate.js
        # tenants IS the tenant dimension — deliberately the one table
        # with no RLS policy (database/migrations/001_create_tenants.sql).
        # Every query in these two files is either against `tenants`
        # itself or session/transaction plumbing (set_config, BEGIN);
        # there is no tenant-scoped data table query here to filter.
        - backend/src/tenants/tenant.repository.ts
        - backend/src/common/tenant-context.middleware.ts
        # Same set_config/dynamic-COMMIT-ROLLBACK plumbing as
        # tenant-context.middleware.ts above — ScimAuthGuard (WO-025)
        # establishes app.current_tenant for a SCIM request the same way.
        - backend/src/scim/scim-auth.guard.ts
        # scim_tokens (database/migrations/025_scim_tokens.sql) is
        # deliberately NOT RLS-protected and has NO tenant_id filter on
        # this ONE lookup query by design: a SCIM request arrives with
        # only a bearer token and no tenant context yet at all — that's
        # what this query discovers. See the migration's own comment for
        # the full justification (same structural reason `tenants` itself
        # isn't tenant-scoped).
        - backend/src/scim/scim-token.repository.ts
        # WO-034: HmacValidationMiddleware authenticates a telemetry
        # request via a per-agent HMAC secret before any tenant context
        # exists — findByIdAcrossTenants is the one deliberately
        # tenant-less agent lookup that resolves the tenant in the first
        # place, same structural reason as the SCIM entries above.
        - backend/src/agents/agents.repository.ts
        # WO-043: AdaptersController establishes app.current_tenant itself
        # (BEGIN/set_config/COMMIT) before calling the telemetry pipeline,
        # the same set_config plumbing tenant-context.middleware.ts and
        # scim-auth.guard.ts are already excluded for above — this is
        # session/transaction setup, not a query against a tenant-scoped
        # application table.
        - backend/src/adapters/adapters.controller.ts
        # WO-047: AuditExportWorkerService runs OUTSIDE the HTTP request
        # lifecycle (fire-and-forget background export processing), so it
        # can't reuse req.tenantDbClient — it establishes its own
        # app.current_tenant the same set_config way, same exclusion class
        # as the entries above.
        - backend/src/audit/export/audit-export-worker.service.ts
        # WO-059: findDistinctTenantIds is the ONE deliberately
        # tenant-less query in this file — ThresholdEvaluationSchedulerService
        # runs OUTSIDE any request/tenant context (a background 5s
        # interval, not tied to one tenant), and this is exactly the
        # query that discovers which tenants need a tick at all, same
        # structural class as agents.repository.ts's own
        # findByIdAcrossTenants above. Every other query in this file is
        # tenant-scoped.
        - backend/src/alerts/alert-threshold.repository.ts
    metadata:
      category: security
      references:
        - database/migrations/006_enable_rls.sql
