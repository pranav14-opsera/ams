{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "base-service.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "base-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "base-service.name" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.cpuUtilizationPercent }}
    {{- if .Values.autoscaling.kafkaLag.enabled }}
    - type: External
      external:
        metric:
          name: kafka_consumergroup_lag
          selector:
            matchLabels:
              consumergroup: {{ .Values.autoscaling.kafkaLag.consumerGroup | quote }}
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.kafkaLag.targetAverageValue | quote }}
    {{- end }}
{{- end }}
