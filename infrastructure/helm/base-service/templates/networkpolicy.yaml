{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "base-service.name" . }}-allow
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "base-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "base-service.labels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- range .Values.networkPolicy.allowFrom }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          {{- if .podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml .podSelector | nindent 14 }}
          {{- end }}
    {{- end }}
{{- end }}
