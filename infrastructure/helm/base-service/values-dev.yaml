# Dev environment overrides — merged on top of values.yaml via `helm upgrade
# -f values.yaml -f values-dev.yaml`. Every service deploys straight to dev
# on every main-branch commit (.forge/pipeline.yaml source stage); a 15-minute
# canary gate on every commit would make dev deploys unusable, so it stays
# off here.
rollout:
  enabled: false

replicaCount: 1

autoscaling:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
